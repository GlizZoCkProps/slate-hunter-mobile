name: collector

# Free always-on host. Runs every 30 minutes; the collector itself decides which
# jobs are due (see slatehunter/scheduler.py), so a late or skipped Actions run
# only delays a snapshot - it never duplicates or overwrites one.
# GitHub may delay scheduled runs at busy times and disables schedules in public
# repos after 60 days without repository activity.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Optional space-separated jobs to force (collect_games collect_injuries collect_props collect_props_propline project grade)"
        required: false
        default: ""

concurrency:
  group: slate-hunter-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SLATE_DB_PATH: datadir/slate_hunter.db
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      SLATE_SPORTS: ${{ vars.SLATE_SPORTS || 'NBA,NFL,CFB' }}
      SLATE_BOOKS: ${{ vars.SLATE_BOOKS || 'draftkings,fanduel,prizepicks' }}
      # Credit plan for the free Odds API tier (500/month): one near-close snapshot
      # per game, taken 60-90 min before its own start, soonest games first across
      # all sports, at most ~15 credits per Central-Time day (~465/month).
      # Override any of these under Settings > Secrets and variables > Actions > Variables.
      SLATE_PROPS_PREGAME_WINDOW_MIN: ${{ vars.SLATE_PROPS_PREGAME_WINDOW_MIN || '90' }}
      SLATE_PROPS_SNAPSHOTS_PER_EVENT: ${{ vars.SLATE_PROPS_SNAPSHOTS_PER_EVENT || '1' }}
      SLATE_ODDS_DAILY_CREDIT_BUDGET: ${{ vars.SLATE_ODDS_DAILY_CREDIT_BUDGET || '15' }}
      SLATE_MAX_EVENTS_PER_RUN: ${{ vars.SLATE_MAX_EVENTS_PER_RUN || '5' }}
      SLATE_ODDS_CREDIT_RESERVE: ${{ vars.SLATE_ODDS_CREDIT_RESERVE || '25' }}
      # PropLine (free 1,000 requests/day): hourly snapshots of every game in the next 12h.
      SLATE_PROPLINE_INTERVAL_MIN: ${{ vars.SLATE_PROPLINE_INTERVAL_MIN || '60' }}
      SLATE_PROPLINE_LOOKAHEAD_HOURS: ${{ vars.SLATE_PROPLINE_LOOKAHEAD_HOURS || '12' }}
      SLATE_PROPLINE_REQUEST_RESERVE: ${{ vars.SLATE_PROPLINE_REQUEST_RESERVE || '150' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: echo "HOUR=$(date -u +%H)" >> "$GITHUB_ENV"

      - name: Restore database from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git worktree add --detach datadir origin/data
            test -f datadir/slate_hunter.db || { echo "::error::data branch exists but has no database; refusing to start fresh"; exit 1; }
            python -m slatehunter integrity --write-baseline baseline.json
          else
            echo "::notice::No data branch yet - creating a new database."
            git worktree add --detach datadir HEAD
            (cd datadir && git checkout -q --orphan first-snapshot && git rm -rfq .)
            echo '{}' > baseline.json
          fi

      - name: Run due jobs
        env:
          FORCE_JOBS: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          for j in $FORCE_JOBS; do
            case "$j" in collect_games|collect_injuries|collect_props|collect_props_propline|project|grade) ARGS="$ARGS --force $j";; *) echo "::warning::ignoring unknown job $j";; esac
          done
          python -m slatehunter run-scheduled $ARGS

      - name: Daily report
        run: python -m slatehunter report --out datadir/reports

      - name: Guard (integrity + append-only row counts)
        run: python -m slatehunter integrity --baseline baseline.json

      - name: Size check
        run: |
          SIZE=$(stat -c %s datadir/slate_hunter.db)
          echo "Database size: $SIZE bytes"
          if [ "$SIZE" -gt 40000000 ]; then echo "::warning::Database is over 40 MB; GitHub blocks files over 100 MB. See PROJECT_HANDOFF.md (scaling)."; fi

      - name: Publish database to the data branch
        run: |
          cd datadir
          git config user.name "slate-hunter-collector"
          git config user.email "slate-hunter-collector@users.noreply.github.com"
          git checkout -q --orphan snapshot-$GITHUB_RUN_ID
          git add -f slate_hunter.db reports
          git commit -q -m "data snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) run $GITHUB_RUN_ID"
          git push -q -f origin HEAD:refs/heads/data

      - name: Twice-daily backup artifact
        if: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON('["05","17"]'), env.HOUR) }}
        uses: actions/upload-artifact@v4
        with:
          name: slate-hunter-db-${{ github.run_id }}
          path: datadir/slate_hunter.db
          retention-days: 14
